<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 40" fill="none" role="img" aria-label="CryoSight">
  <defs>
    <linearGradient id="csg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#14d0d0"/>
      <stop offset="100%" stop-color="#0b8a8b"/>
    </linearGradient>
    <filter id="csglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Eye shape (almond) centered at (22, 20) -->
  <path d="M2,20 Q22,4 42,20 Q22,36 2,20 Z"
        stroke="url(#csg)" stroke-width="1.5" fill="rgba(14,165,166,0.07)" filter="url(#csglow)"/>
  <!-- Iris ring -->
  <circle cx="22" cy="20" r="8.5" stroke="url(#csg)" stroke-width="1.4" fill="none" filter="url(#csglow)"/>
  <!-- 6-fold cryo ticks -->
  <g transform="translate(22,20)" stroke="#0ea5a6" stroke-width="1.1" stroke-linecap="round" opacity="0.82">
    <line x1="0" y1="-8.5" x2="0" y2="-12"/>
    <line x1="0" y1="8.5" x2="0" y2="12"/>
    <line x1="7.36" y1="-4.25" x2="10.39" y2="-6"/>
    <line x1="-7.36" y1="-4.25" x2="-10.39" y2="-6"/>
    <line x1="7.36" y1="4.25" x2="10.39" y2="6"/>
    <line x1="-7.36" y1="4.25" x2="-10.39" y2="6"/>
  </g>
  <!-- Pupil -->
  <circle cx="22" cy="20" r="4" fill="#0ea5a6" filter="url(#csglow)"/>
  <circle cx="22" cy="20" r="1.8" fill="#7df4f4"/>
  <!-- Wordmark -->
  <text y="28" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" letter-spacing="-0.5">
    <tspan x="50" font-weight="700" fill="#0ea5a6">Cryo</tspan><tspan font-weight="300" fill="#64748b">Sight</tspan>
  </text>
</svg>
