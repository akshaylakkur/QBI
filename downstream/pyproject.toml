[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "downstream"
version = "0.1.0"
description = "Downstream geometry metrics for Cryo-ET particle coordinate clouds"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]
gnn = [
    "torch>=2.0",
    "torch-geometric>=2.4",
    "scikit-learn>=1.3",
]
all = ["downstream[dev,gnn]"]

[tool.setuptools.packages.find]
include = ["downstream*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
